<style>
/* Layout: one phone-width column (max 480px) with a sticky top bar and a fixed bottom tab bar.

:root {

function haversineKm(a, b) {
  const R = 6371, r = d => d * Math.PI / 180;
  const dLat = r(b[0] - a[0]), dLon = r(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a[0])) * Math.cos(r(b[0])) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function words(t) {
  const low = String(t).toLowerCase();
  const base = low.replace(/[^a-z0-9 ]/g, " ").split(/\s+/)
    .filter(w => w.length > 2 && !STOP.has(w)).map(w => w.replace(/(ing|ers|er|es|s|ed)$/, ""));
  const tags = CONCEPTS.filter(([, re]) => re.test(low)).flatMap(([tag]) => [tag, tag + "2"]);
  return [...new Set([...base, ...tags])];
}
function keywordSim(a, b) {
  const A = words(a), B = new Set(words(b));
  if (!A.length || !B.size) return 0;
  const hit = A.filter(w => B.has(w)).length;
  return Math.min(1, 0.9 * hit / Math.sqrt(A.length * B.size) + (hit ? 0.2 : 0));
}

const STRONG = 0.45, POSSIBLE = 0.30;
const strengthOf = s => s >= STRONG ? "strong" : s >= POSSIBLE ? "possible" : "weak";

/* Hard filters first (how the work happens, travel range), then score:
   0.75 text match + 0.15 rating + 0.10 closeness */
function rankPeople(simOf, people, area, mode) {
  const here = AREAS[area];
  let best = -1, tooFar = 0;
  const kept = [];
  for (const p of people) {
    const sim = simOf(p);
    if (sim > best) best = sim;
    const remoteOk = p.mode !== "in-person", inPersonOk = p.mode !== "remote";
    if (mode === "remote" && !remoteOk) continue;
    if (mode === "in-person" && !inPersonOk) continue;
    let km = null, close = 1;
    const travels = inPersonOk && !(mode !== "in-person" && remoteOk);
    if (travels) {
      km = haversineKm(here, AREAS[p.area]);
      if (km > p.travel) { if (sim >= POSSIBLE) tooFar++; continue; }
      close = 1 - Math.min(km, 30) / 30;
    }
    const rate = Math.max(0, Math.min(1, ((p.rating || 4) - 3) / 2));
    kept.push({ p, sim, km, close, score: 0.75 * Math.max(0, sim) + 0.15 * rate + 0.10 * close, strength: strengthOf(sim) });
  }
  kept.sort((a, b) => b.score - a.score);
  return { list: kept.filter((x, i) => x.strength !== "weak" || i < 3).slice(0, 9), best, tooFar };
}

/* =========================================================
   AI matching (all-MiniLM-L6-v2 in the browser), keyword fallback
   ========================================================= */
const AI = { state: "loading", extractor: null, cache: new Map() };
AI.ready = new Promise(r => { AI._resolve = r; });
async function embedTexts(texts) {
  const todo = [...new Set(texts.filter(t => !AI.cache.has(t)))];
  for (let i = 0; i < todo.length; i += 8) {
    const chunk = todo.slice(i, i + 8);
    const out = (await AI.extractor(chunk, { pooling: "mean", normalize: true })).tolist();
    chunk.forEach((t, j) => AI.cache.set(t, out[j]));
  }
}
async function similarityFn(query, targets) {
  await Promise.race([AI.ready, new Promise(r => setTimeout(r, 15000))]);
  if (AI.state === "ready") {
    try {
      await embedTexts([query, ...(targets || [])]);
      const q = AI.cache.get(query);
      return text => { const v = AI.cache.get(text); return v ? dot(q, v) : keywordSim(query, text); };
    } catch (e) { AI.state = "failed"; }
  }
  return text => keywordSim(query, text);
}
window.__aiLoaded = async function (pipeline) {
  try { AI.extractor = await pipeline("feature-extraction", "Xenova/all-MiniLM-L6-v2"); await embedTexts(people.map(profileText)); AI.state = "ready"; }
  catch (e) { AI.state = "failed"; }
  AI._resolve();
};
window.__aiFailed = function () { if (AI.state === "loading") { AI.state = "failed"; AI._resolve(); } };

// Rank every candidate. Workers who don't travel this far are counted, not shown.
function rankAll(sim, pool, area) {
  const here = AREAS[area], out = [];
  let tooFar = 0;
  for (const p of pool) {
    const s = sim(profileText(p));
    let km = null, close = 1;
    if (p.mode !== "remote") {
      km = haversineKm(here, AREAS[p.area]);
      if (km > p.travel) { if (p.mode === "in-person") { if (s >= POSSIBLE) tooFar++; continue; } close = 0.4; km = null; }
      else close = 1 - Math.min(km, 30) / 30;
    }
    const rs = Math.max(0, Math.min(1, ((p.rating || 4) - 3) / 2));
    out.push({ p, s, km, score: 0.75 * Math.max(0, s) + 0.15 * rs + 0.10 * close, strength: strengthOf(s) });
  }
  out.sort((a, b) => b.score - a.score);
  return { all: out, tooFar };
}

  if (f.near) list = list.filter(x => x.km != null && x.km <= 10);
  if (f.sort === "near") list.sort((a, b) => (a.km ?? 99) - (b.km ?? 99));
  if (f.sort === "price") list.sort((a, b) => priceFor(a.p) - priceFor(b.p));
  if (f.sort === "rating") list.sort((a, b) => b.p.rating - a.p.rating);
  return list;
}

SC.booking = () => {
  const b = BOOKINGS.find(x => x.id === S.bookingId), p = people[b.workerId], client = isClient();
  const clientName = b.clientEmail ? (ACCOUNTS.find(a => a.email === b.clientEmail)?.name || b.clientName) : b.clientName;
  const other = client ? p : personOf(clientName);
  const otherPhone = client ? phoneOf(p) : (b.clientEmail ? ACCOUNTS.find(a => a.email === b.clientEmail)?.phone : clientPhone(b.clientName));
  const bot = client ? !p.account : !b.clientEmail;
  const order = b.kind === "order";
  const explain = {
    requested: client ? `Waiting for ${first(p.name)} to accept.` : `${first(clientName)} wants to book you. Accept or decline.`,
    confirmed: client ? (order ? `${first(p.name)} is making your order.` : `${first(p.name)} will come ${dayName(b.day).toLowerCase()}.`) : (order ? "Make the order, then send it for delivery." : `You're booked for ${dayName(b.day).toLowerCase()}.`),
    onway: client ? (order ? "Your order is on its way." : `${first(p.name)} is on the way.`) : (order ? "Out for delivery." : "Tap Job is done when you finish."),
    done: client ? (order ? "Delivered. Check it, then pay." : "The work is finished. Check it, then pay.") : `Waiting for ${first(clientName)} to pay ${money(b.price)}.`,
    paid: client ? `Paid ${money(b.price)}. Thank you!` : `${first(clientName)} paid ${money(b.price)}.`,
    declined: client ? `${first(p.name)} can't take this one.` : "You declined this request.",
    cancelled: "This booking was cancelled."
  }[b.status];
  let actions = "";
  if (client) {
    if (b.status === "done") actions = `<button class="btn green" data-act="payRate">${ic("money", 22, "#fff")} Pay ${money(b.price)}</button>`;
    if (["confirmed", "onway"].includes(b.status) && bot) actions += `<button class="btn quiet" data-act="simDone">${order ? "Mark as delivered (demo)" : "Mark the work as finished (demo)"}</button>`;
    if (!order && ["requested", "confirmed"].includes(b.status)) actions += `<div class="btns"><button class="btn alt sm" data-act="resched">Change day or time</button><button class="btn alt sm danger" data-go="cancel">Cancel booking</button></div>`;
    if (order && b.status === "requested") actions += `<button class="btn alt danger" data-go="cancel">Cancel order</button>`;
    if (b.status === "declined") actions += `<button class="btn" data-act="findOthers">Find someone else</button>`;
  } else {
    if (b.status === "requested") actions = `<div class="btns"><button class="btn alt sm danger" data-act="declineOpen">Decline</button><button class="btn sm" data-act="wAccept">${order ? "Accept and start" : "Accept"}</button></div>`

    if (b.status === "onway") actions = `<button class="btn green" data-act="wDone">${ic("check", 22, "#fff", 3)} ${order ? "Delivered" : "Job is done"}</button>`;

  return {
    title: b.title,
    body: `
<div class="card">
  <div class="row">${avatar(other, 56)}<span class="stack grow" style="gap:0"><b class="name">${esc(other.name)}</b><span class="small muted">${client ? esc(p.trade) : (b.clientEmail ? "Wasila client" : "Client")}</span></span></div>

${actions ? `<div class="stack">${actions}</div>` : ""}
${bookingSummary(b)}
${b.rating ? `<div class="card" style="gap:4px"><span class="label">${client ? "Your rating" : "Client's rating"}</span><span class="stars">${"★".repeat(b.rating)}<i>${"★".repeat(5 - b.rating)}</i></span>${b.review ? `<p class="small">${esc(b.review)}</p>` : ""}</div>` : ""}

<div class="field"><label for="rateText">Want to say more? (optional)</label><textarea id="rateText" ${bind("rateText")} placeholder="What went well?">${val("rateText")}</textarea></div>
<div class="card" style="background:var(--tint);gap:6px"><div class="kv"><span class="muted">Total</span><span>${money(b.price)}</span></div><div class="kv"><span class="muted">Paying by</span><span>${b.pay === "card" ? esc(card || "Card") : PAY[b.pay]}</span></div></div>
${b.pay === "card" && !card ? `<div class="field"><label for="cardNum">Card number</label><input type="tel" id="cardNum" ${bind("cardNum")} value="${val("cardNum")}" inputmode="numeric" placeholder="4242 4242 4242 4242"><span class="tiny muted">Demo only. Don't type a real card.</span></div>` : ""}
<button class="btn green" data-act="pay" ${S.rateVal ? "" : "disabled"}>${ic("money", 22, "#fff")} ${payLabel}</button>
${!S.rateVal ? `<p class="small muted center">Pick a face first.</p>` : ""}`
  };
};

/* ---------- messages ---------- */
SC.messages = () => {
  const list = myConvos();
  return {
    title: "Messages", tabs: true,
    body: list.length ? list.map(c => {
      const other = isClient() ? people[c.workerId] : personOf(c.clientEmail ? (ACCOUNTS.find(a => a.email === c.clientEmail)?.name || c.clientName) : c.clientName);
      const last = lastMsg(c), unread = isClient() ? c.msgs.slice(c.readC).some(m => m.from !== "c") : c.msgs.slice(c.readW).some(m => m.from !== "w");
      const preview = last.type === "offer" ? `Price: ${money(last.price)}` : last.type === "photo" ? "Photo" : last.type === "request" ? "Request: " + last.text : last.text;
      return `<button class="card tap" data-act="chat" data-id="${c.id}" style="flex-direction:row;align-items:center;${unread ? "border:2px solid var(--purple)" : ""}">${avatar(other, 52)}
        <span class="stack grow" style="gap:1px"><span class="row between"><b class="name">${esc(other.name)}</b><span class="tiny muted">${clock(last.at)}</span></span>
        <span class="small ${unread ? "" : "muted"}" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${unread ? "font-weight:700" : ""}">${esc(preview)}</span></span></button>`;
    }).join("") : `<div class="empty"><p class="muted">No messages yet.</p>${isClient() ? `<button class="btn" data-tab="home">Find someone</button>` : ""}</div>`
  };
};

SC.chat = () => {
  const c = CONVOS.find(x => x.id === S.convoId), client = isClient();
  const p = people[c.workerId];
  const otherName = client ? p.name : (c.clientEmail ? (ACCOUNTS.find(a => a.email === c.clientEmail)?.name || c.clientName) : c.clientName);
  const otherPhone = client ? phoneOf(p) : (c.clientEmail ? ACCOUNTS.find(a => a.email === c.clientEmail)?.phone : clientPhone(c.clientName));
  const mine = client ? "c" : "w";
  const offerOpen = openOffer(c);
  const body = c.msgs.map(m => {
    const side = m.from === mine ? "me" : "them";
    if (m.from === "sys") return `<p class="sys">${esc(m.text)}</p>`;
    if (m.type === "request") return `<div class="bubble ${side}"><span class="tiny" style="opacity:.8;font-weight:700">${client ? "YOUR REQUEST" : "REQUEST"}</span><br>${esc(m.text)}<span class="mtime">${clock(m.at)}</span></div>`;
    if (m.type === "photo") return `<div class="bubble ${side} photo-bubble"><img src="${m.src}" alt="Photo sent in chat"><span class="mtime">${clock(m.at)}</span></div>`;
    if (m.type === "offer") {
      const st = m.status;
      return `<div class="offer ${st !== "open" ? "dim" : ""}">
        <div class="row between"><span class="label" style="color:var(--purple-dark)">Price from ${esc(first(p.name))}</span><span class="price" style="font-size:24px">${money(m.price)}</span></div>
        <span style="font-weight:600">${esc(m.title || "")}</span>${m.note ? `<span class="small muted">${esc(m.note)}</span>` : ""}
        ${st === "accepted" ? `<span class="badge done" style="align-self:flex-start">Accepted</span>` : st === "replaced" ? `<span class="badge possible" style="align-self:flex-start">Replaced by a newer price</span>`
          : client ? `<button class="btn" data-act="acceptOffer" data-id="${m.id}">Accept and book</button>` : `<span class="badge possible" style="align-self:flex-start">Waiting for ${esc(first(otherName))}</span>`}
        <span class="tiny muted">${clock(m.at)}</span></div>`;
    }
    return `<div class="bubble ${side}">${esc(m.text)}<span class="mtime">${clock(m.at)}</span></div>`;
  }).join("");
  const quick = client ? (offerOpen ? ["Can you do it for less?", "When are you free?", "Can you send photos of your work?"] : ["How much would it cost?", "When are you free?", "Can you send photos of your work?"]) : ["I'm on my way", "Can you send a photo of the problem?", "What time suits you?"];
  return {
    title: otherName, composer: true,
    topExtra: `<a class="icon-btn" href="tel:${digits(otherPhone || "")}" aria-label="Call ${esc(otherName)}">${ic("phone", 22, "#5B2FCB")}</a>`,
    body: `<div class="thread">${body}</div>
<div class="pills" style="margin-top:6px">${quick.map(q => `<button class="pill-btn" data-act="quick" data-v="${esc(q)}">${esc(q)}</button>`).join("")}</div>
${!client ? (S.offerOpen ? `<div class="card" style="border:2px solid var(--purple)"><b>Send a price</b>
  <div class="stepper"><button data-act="ofMinus" aria-label="Lower">−</button><b>${money(S.offer.price)}</b><button data-act="ofPlus" aria-label="Higher">+</button></div>
  <div class="field"><label for="ofNote">What's included (optional)</label><input type="text" id="ofNote" ${bind("offer.note")} value="${val("offer.note")}" placeholder="Parts included"></div>
  <div class="btns"><button class="btn alt sm" data-act="ofClose">Close</button><button class="btn sm" data-act="ofSend">Send price</button></div></div>`
  : `<button class="btn quiet sm" data-act="ofOpen">${ic("money", 20)} Send a price</button>`) : ""}`
  };
};

/* ---------- shop ---------- */
function productCard(x, compact) {
  const m = byName(x.maker);
  return `<article class="product"><button class="art-btn" data-act="product" data-id="${x.id}" aria-label="${esc(x.name)}"><div class="art" style="background-color:${x.colour}"><span>[Photo: ${esc(x.name.toLowerCase())}]</span></div></button>
  <div class="body"><div class="row between" style="align-items:flex-start"><button class="link-plain" data-act="product" data-id="${x.id}"><b style="font-size:17px">${esc(x.name)}</b></button><span class="price">${money(x.price)}</span></div>
  <span class="small muted">${esc(m.name)} · ${esc(m.area)}</span>
  ${compact ? "" : `<span class="small muted">Ready in ${x.days} ${x.days === 1 ? "day" : "days"}</span>`}
  <button class="btn sm" data-act="addBasket" data-id="${x.id}">${ic("bag", 20, "#fff")} Add to basket</button></div></article>`;
}
const basketCount = () => C().basket.reduce((s, i) => s + i.qty, 0);
const basketBtn = () => `<button class="icon-btn" data-go="basket" aria-label="Basket, ${basketCount()} items" style="position:relative">${ic("bag", 22, "#5B2FCB")}${basketCount() ? `<span class="topdot">${basketCount()}</span>` : ""}</button>`;
SC.shop = () => {
  const cats = ["All", ...new Set(PRODUCTS.map(x => x.cat))];
  const q = S.shopQ.trim().toLowerCase();
  const list = PRODUCTS.filter(x => x.available && (S.shopCat === "All" || x.cat === S.shopCat) && (!q || `${x.name} ${x.desc} ${x.maker}`.toLowerCase().includes(q)));
  return {
    title: "Handmade", tabs: true, topExtra: basketBtn(),
    body: `
<form id="shopSearch" class="searchbar" role="search"><label for="sq" class="sr">Search handmade</label><input type="text" id="sq" ${bind("shopQ")} value="${val("shopQ")}" placeholder="Search: blanket, necklace, food" autocomplete="off"><button class="btn" type="submit" aria-label="Search">${ic("search", 22, "#fff")}</button></form>
<div class="pills" role="group" aria-label="Category">${cats.map(c => `<button class="pill-btn" data-act="cat" data-v="${c}" aria-pressed="${S.shopCat === c}">${c}</button>`).join("")}</div>
${list.length ? list.map(x => productCard(x)).join("") : `<p class="notice">Nothing found. Try another word or category.</p>`}
<p class="small muted">Most items are made by women working from home. Every item is made to order.</p>`
  };
};
SC.product = () => {
  const x = PRODUCTS[S.productId], m = byName(x.maker);
  return {
    title: x.name, topExtra: basketBtn(),
    body: `
<div class="art" style="background-color:${x.colour};aspect-ratio:4/3;border-radius:20px"><span>[Photo: ${esc(x.name.toLowerCase())}]</span></div>
<div class="row between" style="align-items:flex-start"><h2 class="h-l">${esc(x.name)}</h2><span class="price" style="font-size:24px">${money(x.price)}</span></div>
<p style="font-size:17px">${esc(x.desc)}</p>
<div class="facts"><span>${ic("clock", 18)} Ready in ${x.days} ${x.days === 1 ? "day" : "days"}</span><span>${ic("truck", 18)} Delivery 60 EGP</span></div>
<button class="card tap" data-act="profile" data-id="${m.id}" style="flex-direction:row;align-items:center">${avatar(m, 48)}<span class="stack grow" style="gap:0"><b>${esc(m.name)}</b><span class="small muted">${esc(m.trade)} · ${esc(m.area)}</span></span>${starRow(m.rating)}</button>
<div class="field"><span style="font-weight:700">How many?</span><div class="stepper"><button data-act="pqMinus" aria-label="Fewer">−</button><b>${S.pq}</b><button data-act="pqPlus" aria-label="More">+</button></div></div>
<div class="field"><label for="pNote">Colours, name or size you want (optional)</label><input type="text" id="pNote" ${bind("pnote")} value="${val("pnote")}" placeholder="White and mint"></div>
<button class="btn" data-act="addBasketQty" data-id="${x.id}">${ic("bag", 20, "#fff")} Add to basket · ${money(x.price * S.pq)}</button>
<button class="btn alt" data-act="askMaker" data-id="${x.id}">${ic("chat", 20)} Ask ${esc(first(m.name))} a question</button>`
  };
};
SC.basket = () => {
  const items = C().basket;
  if (!items.length) return { title: "Basket", body: `<div class="empty"><p class="muted">Your basket is empty.</p><button class="btn" data-tab="shop">Browse handmade</button></div>` };
  const byMaker = {};
  items.forEach((it, i) => { const x = PRODUCTS[it.productId]; (byMaker[x.maker] ||= []).push({ ...it, i, x }); });
  const makers = Object.keys(byMaker);
  const sub = items.reduce((s, it) => s + PRODUCTS[it.productId].price * it.qty, 0), del = makers.length * 60;
  return {
    title: "Basket",
    body: `
${makers.map(mk => `<section class="card"><div class="row">${avatar(byName(mk), 36)}<b class="grow">From ${esc(mk)}</b></div>
  ${byMaker[mk].map(it => `<div class="basket-row"><div class="stack grow" style="gap:0"><b>${esc(it.x.name)}</b>${it.note ? `<span class="small muted">“${esc(it.note)}”</span>` : ""}<span class="small">${money(it.x.price)} each</span></div>
    <div class="mini-step"><button data-act="bMinus" data-v="${it.i}" aria-label="Fewer">−</button><b>${it.qty}</b><button data-act="bPlus" data-v="${it.i}" aria-label="More">+</button></div></div>`).join("")}
  <span class="tiny muted">One delivery from ${esc(first(mk))}: 60 EGP</span></section>`).join("")}
<section class="section"><h2 class="h-m">Deliver to</h2>${addrPicker("bk")}</section>
<section class="section"><h2 class="h-m">How will you pay?</h2>${payPicker("bk.pay")}</section>
<div class="card" style="background:var(--tint);gap:6px">
  <div class="kv"><span class="muted">Items</span><span>${money(sub)}</span></div><div class="kv"><span class="muted">Delivery</span><span>${money(del)}</span></div>
  <div class="kv" style="font-size:19px"><span>Total</span><span>${money(sub + del)}</span></div><p class="small muted">You pay when it arrives.</p></div>
${S.bkErr ? `<p class="error" role="alert">${esc(S.bkErr)}</p>` : ""}
<button class="btn" data-act="placeOrder">Place order${makers.length > 1 ? `s (${makers.length})` : ""}</button>`
  };
};

/* ---------- client account ---------- */
SC.me = () => {
  if (!isClient()) return SC.wme();
  const c = C(), reqs = ALL_REQUESTS.filter(r => r.owner === meEmail());
  return {
    title: "My account",
    body: `
<div class="center">${avatar(personOf(S.user.name), 80)}<h2 class="h-l">${esc(S.user.name)}</h2><span class="num muted">${esc(S.user.phone)}</span></div>
<section class="section"><h2 class="h-m">My requests</h2>${reqs.length ? reqs.map(r => `<button class="card tap" data-act="openReq" data-id="${r.id}" style="flex-direction:row;align-items:center">${ic(r.icon, 26, "#5B2FCB")}<span class="grow"><b>${esc(r.label || r.text)}</b><br><span class="small muted">${esc(r.ago)}</span></span><span class="badge ${r.status === "open" ? "strong" : "possible"}">${r.status === "open" ? "Open" : r.status === "booked" ? "Booked" : "Closed"}</span></button>`).join("") : `<p class="muted small">No requests yet.</p>`}</section>
<section class="section"><h2 class="h-m">Addresses</h2>
${c.addresses.map((a, i) => `<div class="card" style="flex-direction:row;align-items:center">${ic("pin", 24, "#5B2FCB")}<span class="grow"><b>${esc(a.label || "Address")}</b><br><span class="small muted">${esc(addrText(a))}</span></span><button class="icon-btn" data-act="delAddr" data-v="${i}" aria-label="Remove address">${ic("x", 20)}</button></div>`).join("")}
${S.meAddrOpen ? `<div class="card" style="background:var(--tint)">
  <div class="field"><label for="naLabel">Name it</label><input type="text" id="naLabel" ${bind("na.label")} value="${val("na.label")}" placeholder="Home, Mum's flat, Work"></div>
  <div class="field"><label for="naArea">Area</label><select id="naArea" ${bind("na.area")}>${areaOptions(S.na.area)}</select></div>
  <div class="field"><label for="naLine">Building and street</label><input type="text" id="naLine" ${bind("na.line")} value="${val("na.line")}"></div>
  <div class="field"><label for="naDet">Floor and flat</label><input type="text" id="naDet" ${bind("na.details")} value="${val("na.details")}"></div>
  <div class="btns"><button class="btn alt sm" data-act="naClose">Cancel</button><button class="btn sm" data-act="naSave">Save address</button></div></div>`
  : `<button class="btn alt sm" data-act="naOpen">${ic("plus", 20)} Add an address</button>`}</section>
<section class="section"><h2 class="h-m">Payment</h2>
${c.card ? `<div class="card" style="flex-direction:row;align-items:center">${ic("card", 24, "#5B2FCB")}<b class="grow">${esc(c.card)}</b><button class="icon-btn" data-act="delCard" aria-label="Remove card">${ic("x", 20)}</button></div>`
  : `<div class="field"><label for="meCard">Add a card (demo, don't use a real one)</label><input type="tel" id="meCard" ${bind("cardNum")} value="${val("cardNum")}" inputmode="numeric" placeholder="4242 4242 4242 4242"></div><button class="btn alt sm" data-act="saveCard">Save card</button>`}
<p class="small muted">You can always pay in cash or by mobile wallet after the job.</p></section>
<button class="btn alt" data-act="logout">${ic("out", 20)} Sign out</button>`
  };
};

SC.req = () => {
  const r = ALL_REQUESTS.find(x => x.id === S.reqId);
  const offers = CONVOS.filter(c => c.clientEmail === meEmail()).map(c => ({ c, m: [...c.msgs].reverse().find(m => m.type === "offer" && m.reqId === r.id && m.status === "open") })).filter(x => x.m);
  return {
    title: "Your request",
    body: `
<div class="card"><div class="row">${ic(r.icon, 30, "#5B2FCB")}<b class="grow" style="font-size:18px">${esc(r.label || r.text)}</b><span class="badge ${r.status === "open" ? "strong" : "possible"}">${r.status === "open" ? "Open" : r.status === "booked" ? "Booked" : "Closed"}</span></div>
<p>${esc(r.text)}</p><span class="small muted">${esc(r.area)} · posted ${esc(r.ago)}</span></div>
<section class="section"><h2 class="h-m">Prices you got</h2>${offers.length ? offers.map(({ c, m }) => { const p = people[c.workerId];
  return `<div class="card"><button class="who" data-act="profile" data-id="${p.id}">${avatar(p, 48)}<span class="stack grow" style="gap:0"><b>${esc(p.name)}</b><span class="trade">${esc(p.trade)}</span>${starRow(p.rating)}</span><span class="price">${money(m.price)}</span></button>
  ${m.note ? `<p class="small muted">${esc(m.note)}</p>` : ""}<div class="btns"><button class="btn alt sm" data-act="chat" data-id="${c.id}">${ic("chat", 20)} Chat</button><button class="btn sm" data-act="acceptOfferIn" data-c="${c.id}" data-id="${m.id}">Accept and book</button></div></div>`; }).join("")
  : `<p class="muted small">No prices yet. Workers near you who fit the job can send you one.</p>`}</section>
${r.status === "open" ? `<button class="btn" data-act="reqFind">Find people now</button><div class="btns"><button class="btn alt sm" data-act="reqEdit">${ic("edit", 20)} Edit</button><button class="btn alt sm danger" data-act="reqClose">Close request</button></div>` : ""}`
  };
};

/* ---------- worker ---------- */
SC.jobs = () => {
  const me = S.me;
  const reqs = ALL_REQUESTS.filter(r => isOpen(r) && !r.draft && r.owner !== meEmail() && !S.passed.has(r.id));
  const sent = id => CONVOS.some(c => c.workerId === me.id && c.msgs.some(m => m.type === "offer" && m.reqId === id && m.from === "w"));
  const here = AREAS[me.area];
  const scored = S.jobScores || {};
  const list = reqs.map(r => ({ r, s: scored[r.id] ?? keywordSim(profileText(me), r.ask), km: me.mode === "remote" ? null : haversineKm(here, AREAS[r.area]) }))
    .filter(x => x.s >= POSSIBLE && (x.km == null || me.mode === "both" || x.km <= me.travel)).sort((a, b) => b.s - a.s);
  return {
    top: `<span class="logo">${logo}<b>wasila</b></span>${signOutBtn}`, tabs: true,
    body: `
<div class="row">${avatar(me, 56)}<div class="stack grow" style="gap:0"><h2 class="h-l">Hi ${esc(first(me.name))}</h2><span class="trade">${esc(me.trade)} · ${esc(me.area)}</span></div></div>
<button class="toggle" data-act="avail" aria-pressed="${!!me.available}" style="min-height:56px;font-size:16px"><span class="track"><span class="knob"></span></span>${me.available ? "I'm taking jobs" : "I'm not taking jobs"}</button>
${bookingBadge() ? `<button class="card tap" data-tab="bookings" style="border:2px solid var(--purple);flex-direction:row;align-items:center">${ic("cal", 26, "#5B2FCB")}<b class="grow">${bookingBadge()} booking ${bookingBadge() === 1 ? "request" : "requests"} waiting for you</b>${ic("send", 20)}</button>` : ""}
<h2 class="h-m">Jobs near you</h2>
${!me.available ? `<p class="notice">Turn on "I'm taking jobs" to see new jobs and appear in searches.</p>`
  : list.length ? list.map(x => { const done = sent(x.r.id), price = S.prices[x.r.id] ?? priceFor(me);
    return `<article class="card">
      <b style="font-size:18px;line-height:1.3">${esc(x.r.ask)}</b>
      <div class="facts"><span>${ic("user", 18)} ${esc(x.r.client)}</span><span>${ic("pin", 18)} ${esc(x.r.area)}${x.km != null ? `, ${Math.max(1, Math.round(x.km))} km` : ""}</span><span>${ic("money", 18)} ${esc(x.r.budget)}</span><span>${ic("clock", 18)} ${esc(x.r.ago)}</span></div>
      ${done ? `<p class="row" style="color:var(--green);font-weight:700">${ic("check", 22, "#1F7A3E", 3)} Price sent. You'll see the reply in Messages.</p>`
      : `<span class="small" style="font-weight:700">Your price</span>
        <div class="stepper"><button data-act="pminus" data-id="${x.r.id}" aria-label="Lower">−</button><b>${money(price)}</b><button data-act="pplus" data-id="${x.r.id}" aria-label="Higher">+</button></div>
        <div class="btns"><button class="btn alt sm" data-act="pass" data-id="${x.r.id}">Not for me</button><button class="btn sm" data-act="sendPrice" data-id="${x.r.id}">Send price</button></div>`}
    </article>`; }).join("")
  : `<p class="notice">No new jobs that fit you right now. New ones show up here.</p>`}`
  };
};

SC.schedule = () => {
  const mine = BOOKINGS.filter(b => b.workerId === S.me.id && ["confirmed", "onway", "done"].includes(b.status));
  const items = mine.filter(b => b.day === S.schedDay).sort((a, b) => Object.keys(SLOTS).indexOf(a.slot) - Object.keys(SLOTS).indexOf(b.slot));
  return {
    title: "Schedule", tabs: true,
    body: `
<div class="days">${[0, 1, 2, 3, 4, 5, 6].map(i => `<button class="day" data-act="day" data-v="${i}" aria-pressed="${S.schedDay === i}"><span class="tiny" style="font-weight:700">${i === 0 ? "Today" : dayShort(i)}</span><b>${dayDate(i).getDate()}</b><i style="background:${mine.some(b => b.day === i) ? (S.schedDay === i ? "#fff" : "var(--purple)") : "transparent"}"></i></button>`).join("")}</div>
<h2 class="h-m">${esc(dayName(S.schedDay))}</h2>
${items.length ? items.map(b => `<button class="card tap" data-act="openBooking" data-id="${b.id}">
  <div class="row">${ic(b.kind === "order" ? "truck" : SLOT_IC[b.slot] || "clock", 26, "#5B2FCB")}<b class="grow">${b.kind === "order" ? "Delivery due" : esc(SLOTS[b.slot])}</b><span class="badge ${badgeClass(b.status)}">${statusText(b)}</span></div>
  <b>${esc(b.title)}</b><span class="small muted">${esc(b.clientName)} · ${esc(addrText(b.address))}</span></button>`).join("")
  : `<p class="muted">Nothing booked this day.</p>`}
<p class="small muted">${mine.length} upcoming ${mine.length === 1 ? "job" : "jobs"} this week.</p>`
  };
};

SC.wme = () => {
  const me = S.me;
  if (!S.meEdit) S.meEdit = { bio: me.bio, area: me.area, travel: me.travel || 15 };
  const paid = BOOKINGS.filter(b => b.workerId === me.id && b.status === "paid");
  const earned = paid.reduce((s, b) => s + b.price, 0);

const toTop = () => { try { window.scrollTo(0, 0); } catch (e) { } };
function go(screen) { S.stack.push(S.screen); S.screen = screen; S.toast = ""; render(); toTop(); }

async function scoreJobs() {
  const me = S.me; if (!me) return;
  const reqs = ALL_REQUESTS.filter(r => isOpen(r) && !r.draft);
  const sim = await similarityFn(profileText(me), reqs.map(r => r.ask));
  if (S.me !== me) return;
  S.jobScores = {}; reqs.forEach(r => { S.jobScores[r.id] = sim(r.ask); });
  if (S.screen === "jobs") render();
}

async function runMatch(req) {
  const pool = people.filter(p => p.available !== false && p !== S.me);

}

/* ---------- sample workers and clients reply on their own ---------- */
function botConfirm(b) {
  const p = people[b.workerId];
  later(2600, () => {
    if (b.status !== "requested") return;
    b.status = "confirmed";
    logEvent(b, b.kind === "order" ? `${first(p.name)} accepted and started making it` : `${first(p.name)} accepted`);
    addMsg(convoFor(b), { from: "w", type: "text", text: b.kind === "order" ? `Thank you! I'm starting on it now. It will be ready ${dayName(b.day).toLowerCase()}.` : `Confirmed for ${dayName(b.day).toLowerCase()}, ${SLOTS[b.slot].toLowerCase()}. I'll call before I come.` });
    notifyClient(b.clientEmail, b.kind === "order" ? `${first(p.name)} accepted your order.` : `${first(p.name)} accepted your booking.`);
  });
}
function botWorkerOffer(c, req) {
  const p = people[c.workerId];
  later(1800, () => {
    if (c.msgs.some(m => m.type === "offer" && m.reqId === req.id)) return;
    addMsg(c, { from: "w", type: "text", text: `Hi ${c.clientName}, I can help with this. Here's my price:` });
    sendOffer(c, priceFor(p), req.label || shortText(req.text), req.id, "");
    notifyClient(c.clientEmail, `${first(p.name)} sent you a price.`);
  });
}
function botWorkerReply(c, text, isPhoto) {
  const p = people[c.workerId], t = String(text || "").toLowerCase();
  later(1500, () => {
    if (isPhoto) addMsg(c, { from: "w", type: "text", text: "Thanks for the photo, that helps. I understand the job." });
    else if (/cheap|less|lower|discount|too much|expensive/.test(t)) {
      const last = [...c.msgs].reverse().find(m => m.type === "offer");
      const base = last ? last.price : priceFor(p), np = Math.max(100, Math.round(base * 0.9 / 50) * 50);
      addMsg(c, { from: "w", type: "text", text: "OK, I can do a better price for you:" });
      const req = last?.reqId ? ALL_REQUESTS.find(r => r.id === last.reqId) : null;
      sendOffer(c, np, last?.title || (req ? req.label || shortText(req.text) : p.trade), last?.reqId, "");
    }
    else if (/how much|price|cost/.test(t)) {
      const req = [...c.msgs].reverse().find(m => m.type === "request");
      addMsg(c, { from: "w", type: "text", text: "Here's my price:" });
      sendOffer(c, priceFor(p), req ? shortText(req.text) : p.trade, req?.reqId, "");
    }
    else if (/when|time|today|tomorrow|free|available/.test(t)) addMsg(c, { from: "w", type: "text", text: "I'm free tomorrow morning or afternoon. You can pick the time when you book." });
    else if (/photo|picture|work/.test(t)) addMsg(c, { from: "w", type: "text", text: "You can see my work and reviews on my profile. Happy to send more photos on WhatsApp too." });
    else addMsg(c, { from: "w", type: "text", text: "Thanks, got it. Tell me if you have any questions." });
    notifyClient(c.clientEmail, `New message from ${first(p.name)}.`);
  });
}
function botClientAccept(c, offer, req) {
  later(3200, () => {
    if (offer.status !== "open") return;
    offer.status = "accepted";
    if (req) req.status = "booked";
    addMsg(c, { from: "c", type: "text", text: "That works for me. Please come tomorrow afternoon." });
    const area = req?.area || people[c.workerId].area;
    newBooking({ clientEmail: null, clientName: c.clientName, workerId: c.workerId, title: offer.title || "Job", icon: "tool", reqId: req?.id, day: 1, slot: "afternoon",
      address: fakeAddr(c.clientName, area), pay: "cash", price: offer.price, status: "confirmed" });
    notifyWorker(c.workerId, `${c.clientName} accepted your price. It's in Bookings.`);
  });
}
function botClientPay(b) {
  later(2600, () => {
    if (b.status !== "done") return;
    const p = people[b.workerId];
    b.status = "paid"; b.rating = 5; b.review = "Thank you, very good work.";
    logEvent(b, `Paid ${money(b.price)} ${b.pay === "cash" ? "in cash" : "by " + PAY[b.pay].toLowerCase()}`);
    p.reviews.unshift({ who: `${b.clientName}, ${b.address.area}`, rating: 5, tags: [], text: b.review });
    p.rating = Math.round(((p.rating * p.jobs + 5) / (p.jobs + 1)) * 10) / 10; p.jobs += 1;
    notifyWorker(b.workerId, `${b.clientName} paid you ${money(b.price)}.`);
  });
}
function botClientReply(c) { later(1500, () => { addMsg(c, { from: "c", type: "text", text: "Thank you!" }); notifyWorker(c.workerId, `New message from ${c.clientName}.`); }); }

function resolveAddress(st, errPrefix) {
  const c = C();
  if (st.addr === "new") {
    if (st.na.line.trim().length < 3) return { err: "Write the building and street." };
    const a = { ...st.na, label: st.na.label || (c.addresses.length ? `Address ${c.addresses.length + 1}` : "Home") };
    c.addresses.push(a); st.addr = c.addresses.length - 1; st.na = blankAddr(S.area);

}
function submitBooking() {
  const b = S.bf, p = people[b.workerId];
  const err = m => { S.bfErr = m; render(); };
  if (!b.title || b.title.trim().length < 3) return err("Write what the job is.");
  if (b.day == null) return err("Pick a day.");
  if (!b.slot) return err("Pick a time.");
  const { addr, err: aErr } = resolveAddress(b); if (aErr) return err(aErr);
  let req = b.reqId ? (ALL_REQUESTS.find(r => r.id === b.reqId) || (S.active?.id === b.reqId ? S.active : null)) : null;
  if (req) { postRequest(req); req.status = "booked"; }
  const cv = convo(meEmail(), first(S.user.name), p.id);
  if (req && !cv.msgs.some(m => m.type === "request" && m.reqId === req.id)) addMsg(cv, { from: "c", type: "request", text: req.text, reqId: req.id });
  if (b.offerId) { const m = CONVOS.find(x => x.id === b.convoId)?.msgs.find(x => x.id === b.offerId); if (m) m.status = "accepted"; }
  const status = b.priceFixed ? "confirmed" : "requested";
  const bk = newBooking({ clientEmail: meEmail(), clientName: first(S.user.name), workerId: p.id, title: b.title.trim(), icon: b.icon, reqId: req?.id, day: b.day, slot: b.slot,
    address: addr, notes: b.notes.trim(), pay: b.pay, price: b.price, status });
  addMsg(cv, { from: "sys", text: `${status === "confirmed" ? "Booked" : "Booking request sent"}: ${dayName(b.day)}, ${SLOTS[b.slot].toLowerCase()}` });
  if (status === "requested" && !p.account) botConfirm(bk);

}
function placeOrder() {
  const c = C();
  if (!c.basket.length) return;
  const { addr, err } = resolveAddress(S.bk); if (err) { S.bkErr = err; render(); return; }
  const byMaker = {};
  c.basket.forEach(it => { const x = PRODUCTS[it.productId]; (byMaker[x.maker] ||= []).push(it); });
  Object.entries(byMaker).forEach(([mk, items]) => {
    const p = byName(mk);
    const price = items.reduce((s, it) => s + PRODUCTS[it.productId].price * it.qty, 0) + 60;
    const title = items.length === 1 ? `${PRODUCTS[items[0].productId].name} ×${items[0].qty}` : `${items.reduce((s, i) => s + i.qty, 0)} handmade items`;
    const b = newBooking({ kind: "order", clientEmail: meEmail(), clientName: first(S.user.name), workerId: p.id, title, icon: "bag", items: items.map(i => ({ ...i })),
      day: Math.max(...items.map(i => PRODUCTS[i.productId].days)), slot: null, address: addr, pay: S.bk.pay, price, status: "requested" });
    addMsg(convo(meEmail(), first(S.user.name), p.id), { from: "sys", text: `Order placed: ${title}` });

/* ---------- clicks ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-go],[data-tab]");
  if (!t || t.disabled) return;
  if (t.dataset.tab) { tab(t.dataset.tab); return; }
  if (t.dataset.go) {
    S.authErr = "";
    if (t.dataset.go === "cancel") S.cancelReason = "";
    go(t.dataset.go); return;
  }
  const a = t.dataset.act, v = t.dataset.v, id = t.dataset.id, n = Number(id);
  const B = () => BOOKINGS.find(x => x.id === S.bookingId);
  switch (a) {
    case "back": back(); break;
    case "quickLogin": login(ACCOUNTS.find(x => x.email === t.dataset.email)); break;
    case "logout": logout(); break;
    case "suRole": S.su.role = v; render(); break;

    // search
    case "task": { const x = TASKS[Number(t.dataset.i)]; startSearch(x[0], x[1], x[2], false); break; }
    case "wtask": { const x = WOMEN_TASKS[Number(t.dataset.i)]; startSearch(x[0], x[1], x[2], true); break; }
    case "sort": S.filt.sort = v; render(); break;
    case "filt": S.filt[v] = !S.filt[v]; render(); break;
    case "editReq": { const r = S.active; S.edit = { text: r.text, area: r.area, reqId: r.draft ? null : r.id }; go("type"); break; }
    case "postReq": {
      postRequest(S.active); toast("Posted. Workers near you can now send you prices.");
      (S.results?.all || []).filter(x => x.strength === "strong" && !x.p.account).slice(0, 2).forEach((x, i) => {
        const c = convo(meEmail(), first(S.user.name), x.p.id), r = S.active;
        later(2500 + i * 3000, () => { if (c.msgs.some(m => m.reqId === r.id)) return; addMsg(c, { from: "c", type: "request", text: r.text, reqId: r.id }); botWorkerOffer(c, r); });
      });
      break;
    }
    case "typeGo": {
      const text = S.edit.text.trim();
      if (text.length < 3) { toast("Write what you need first."); break; }
      S.area = S.edit.area;
      let r;
      if (S.edit.reqId) { r = ALL_REQUESTS.find(x => x.id === S.edit.reqId); r.text = r.ask = text; r.area = S.edit.area; r.label = ""; }
      else r = makeRequest({ owner: meEmail(), client: first(S.user.name), area: S.edit.area, text, label: "", icon: "pencil", draft: true });
      S.active = r; S.results = null;
      if (S.stack[S.stack.length - 1] === "results") { S.stack.pop(); S.screen = "results"; render(); toTop(); } else go("results");
      runMatch(r); break;
    }
    case "profile": S.sel = n; go("profile"); break;
    case "message": openConvoWith(n); break;
    case "book": bookFromSearch(n); break;

    // booking form
    case "pickAddr": setPath(t.dataset.path + ".addr", v === "new" ? "new" : Number(v)); render(); break;
    case "pickPay": setPath(t.dataset.path, v); render(); break;
    case "bfDay": S.bf.day = Number(v); render(); break;
    case "bfSlot": S.bf.slot = v; render(); break;
    case "submitBooking": submitBooking(); break;
    case "openBooking": S.bookingId = n; S.declineFor = null; go("booking"); break;
    case "openConvoOf": { const b = BOOKINGS.find(x => x.id === n); openChat(convoFor(b).id); break; }
    case "cseg": S.cseg = v; render(); break;
    case "wseg": S.wseg = v; render(); break;

    // client booking actions
    case "payRate": S.rateVal = 0; S.rateText = ""; go("rate"); break;
    case "simDone": { const b = B(); b.status = "done"; logEvent(b, b.kind === "order" ? "Delivered" : "Work finished"); render(); break; }
    case "resched": { const b = B(); S.resched = { day: b.day, slot: b.slot }; go("reschedule"); break; }
    case "rsDay": S.resched.day = Number(v); render(); break;
    case "rsSlot": S.resched.slot = v; render(); break;
    case "rsSave": {
      const b = B(), p = people[b.workerId];
      if (S.resched.day == null || !S.resched.slot) { toast("Pick a day and a time."); break; }
      b.day = S.resched.day; b.slot = S.resched.slot;
      const when = `${dayName(b.day)}, ${SLOTS[b.slot].toLowerCase()}`;
      logEvent(b, `New time asked for: ${when}`);
      addMsg(convoFor(b), { from: "sys", text: `New time asked for: ${when}` });
      b.status = "requested";
      if (!p.account) botConfirm(b);
      back(); toast(`Sent. ${first(p.name)} will confirm the new time.`); break;
    }
    case "cReason": S.cancelReason = v; render(); break;
    case "cConfirm": {
      const b = B(); if (!S.cancelReason) break;
      b.status = "cancelled";
      logEvent(b, `Cancelled by ${isClient() ? "client" : "worker"}: ${S.cancelReason}`);
      addMsg(convoFor(b), { from: "sys", text: `Booking cancelled: ${S.cancelReason}` });
      const r = b.reqId && ALL_REQUESTS.find(x => x.id === b.reqId); if (r) r.status = isClient() ? "closed" : "open";
      if (isClient()) notifyWorker(b.workerId, ""); else notifyClient(b.clientEmail, `${first(S.me.name)} cancelled: ${S.cancelReason}`);
      back(); toast("Cancelled."); break;
    }
    case "findOthers": {
      const b = B(), r = b.reqId && ALL_REQUESTS.find(x => x.id === b.reqId);
      if (r) { r.status = "open"; S.active = r; S.results = null; S.filt = { sort: "best", women: false, top: false, near: false }; go("results"); runMatch(r); } else tab("home");
      break;
    }
    case "rateVal": S.rateVal = Number(v); render(); break;
    case "pay": {
      const b = B(), p = people[b.workerId], c = C();
      if (!S.rateVal) break;
      if (b.pay === "card" && !c.card) { const d = digits(S.cardNum); if (d.length < 12) { toast("Type your card number to pay by card."); break; } c.card = `Card ending ${d.slice(-4)}`; S.cardNum = ""; }
      b.status = "paid"; b.rating = S.rateVal; b.review = S.rateText.trim();
      logEvent(b, `Paid ${money(b.price)} ${b.pay === "cash" ? "in cash" : b.pay === "card" ? "by card" : "by mobile wallet"}`);
      p.reviews.unshift({ who: `${first(S.user.name)}, ${b.address.area}`, rating: S.rateVal, tags: [], text: b.review });
      p.rating = Math.round(((p.rating * p.jobs + S.rateVal) / (p.jobs + 1)) * 10) / 10; p.jobs += 1;
      const r = b.reqId && ALL_REQUESTS.find(x => x.id === b.reqId); if (r) r.status = "closed";
      addMsg(convoFor(b), { from: "sys", text: `Paid ${money(b.price)}. Thank you!` });
      back(); toast(`Paid ${money(b.price)} to ${p.name}. Thank you!`); break;
    }

    // worker booking actions
    case "declineOpen": S.declineFor = S.bookingId; render(); break;
    case "wDecline": {
      const b = B(); b.status = "declined"; logEvent(b, `Declined: ${v}`); S.declineFor = null;
      addMsg(convoFor(b), { from: "sys", text: `${first(S.me.name)} can't take this booking: ${v}` });
      const r = b.reqId && ALL_REQUESTS.find(x => x.id === b.reqId); if (r) r.status = "open";
      notifyClient(b.clientEmail, ""); render(); break;
    }
    case "wAccept": {
      const b = B(); b.status = "confirmed"; logEvent(b, b.kind === "order" ? "Accepted and started making it" : "Accepted");
      addMsg(convoFor(b), { from: "w", type: "text", text: b.kind === "order" ? `Thank you! I'm starting on it now.` : `Confirmed for ${dayName(b.day).toLowerCase()}, ${SLOTS[b.slot].toLowerCase()}. I'll call before I come.` });
      toast(b.kind === "order" ? "Accepted. It's in Upcoming." : `Accepted. It's in your schedule for ${dayName(b.day).toLowerCase()}.`); break;
    }
    case "wOnway": {
      const b = B(); b.status = "onway"; logEvent(b, b.kind === "order" ? "Sent for delivery" : "On the way");
      addMsg(convoFor(b), { from: "w", type: "text", text: b.kind === "order" ? "Your order is on its way to you." : "I'm on my way." }); render(); break;
    }
    case "wDone": {
      const b = B(); b.status = "done"; logEvent(b, b.kind === "order" ? "Delivered" : "Work finished");
      if (!b.clientEmail) botClientPay(b); render(); break;
    }

    // chat
    case "chat": openChat(n); break;
    case "acceptOffer": acceptOffer(S.convoId, n); break;
    case "acceptOfferIn": acceptOffer(Number(t.dataset.c), n); break;
    case "quick": sendChat(v); break;
    case "ofOpen": { const c = CONVOS.find(x => x.id === S.convoId); S.offerOpen = true; S.offer = { price: openOffer(c)?.price || priceFor(S.me), note: "" }; render(); break; }
    case "ofClose": S.offerOpen = false; render(); break;
    case "ofMinus": S.offer.price = Math.max(50, S.offer.price - 50); render(); break;
    case "ofPlus": S.offer.price += 50; render(); break;
    case "ofSend": {
      const c = CONVOS.find(x => x.id === S.convoId);
      const reqMsg = [...c.msgs].reverse().find(m => m.type === "request");
      const req = reqMsg?.reqId ? ALL_REQUESTS.find(r => r.id === reqMsg.reqId) : null;
      const o = sendOffer(c, S.offer.price, req ? (req.label || shortText(req.text)) : S.me.trade, req?.id, S.offer.note.trim());
      S.offerOpen = false; S.scrollChat = true;
      if (!c.clientEmail) botClientAccept(c, o, req); else notifyClient(c.clientEmail, "");
      render(); break;
    }

    // shop
    case "cat": S.shopCat = v; render(); break;
    case "product": S.productId = n; S.pq = 1; S.pnote = ""; go("product"); break;
    case "pqMinus": S.pq = Math.max(1, S.pq - 1); render(); break;
    case "pqPlus": S.pq = Math.min(20, S.pq + 1); render(); break;
    case "addBasket": case "addBasketQty": {
      const c = C(), qty = a === "addBasketQty" ? S.pq : 1, note = a === "addBasketQty" ? S.pnote.trim() : "";
      const same = c.basket.find(i => i.productId === n && i.note === note);
      if (same) same.qty += qty; else c.basket.push({ productId: n, qty, note });
      if (a === "addBasketQty") { S.pq = 1; S.pnote = ""; back(); }
      toast(`Added to your basket.`); break;
    }
    case "askMaker": {
      const x = PRODUCTS[n], m = byName(x.maker), c = convo(meEmail(), first(S.user.name), m.id);
      addMsg(c, { from: "c", type: "text", text: `Hi, I have a question about your ${x.name.toLowerCase()}.` });
      if (!m.account) later(1500, () => { addMsg(c, { from: "w", type: "text", text: "Hi! Ask me anything. I can change the colours or the size for you." }); notifyClient(c.clientEmail, `New message from ${first(m.name)}.`); });
      openChat(c.id); break;
    }
    case "bMinus": case "bPlus": {
      const c = C(), it = c.basket[Number(v)];
      it.qty += a === "bPlus" ? 1 : -1;
      if (it.qty <= 0) c.basket.splice(Number(v), 1);
      render(); break;
    }
    case "placeOrder": placeOrder(); break;

    // client account
    case "naOpen": S.meAddrOpen = true; S.na = blankAddr(S.area); render(); break;
    case "naClose": S.meAddrOpen = false; render(); break;
    case "naSave": {
      if (S.na.line.trim().length < 3) { toast("Write the building and street."); break; }
      C().addresses.push({ ...S.na, label: S.na.label.trim() || "Address" }); S.meAddrOpen = false; toast("Address saved."); break;
    }
    case "delAddr": C().addresses.splice(Number(v), 1); render(); break;
    case "saveCard": { const d = digits(S.cardNum); if (d.length < 12) { toast("That card number looks too short."); break; } C().card = `Card ending ${d.slice(-4)}`; S.cardNum = ""; toast("Card saved."); break; }
    case "delCard": C().card = null; render(); break;
    case "openReq": S.reqId = id; go("req"); break;
    case "reqFind": { const r = ALL_REQUESTS.find(x => x.id === S.reqId); S.active = r; S.results = null; S.filt = { sort: "best", women: false, top: false, near: false }; go("results"); runMatch(r); break; }
    case "reqEdit": { const r = ALL_REQUESTS.find(x => x.id === S.reqId); S.edit = { text: r.text, area: r.area, reqId: r.id }; go("type"); break; }
    case "reqClose": { const r = ALL_REQUESTS.find(x => x.id === S.reqId); r.status = "closed"; back(); toast("Request closed."); break; }

    // worker
    case "avail": S.me.available = !S.me.available; render(); break;
    case "pminus": case "pplus": { const cur = S.prices[id] ?? priceFor(S.me); S.prices[id] = Math.max(50, cur + (a === "pplus" ? 50 : -50)); render(); break; }
    case "pass": S.passed.add(id); render(); break;
    case "sendPrice": {
      const r = ALL_REQUESTS.find(x => x.id === id), me = S.me, price = S.prices[id] ?? priceFor(me);
      const c = convo(r.owner, r.client, me.id);
      if (!c.msgs.some(m => m.type === "request" && m.reqId === r.id)) addMsg(c, { from: "c", type: "request", text: r.ask, reqId: r.id, at: Date.now() - 60000 });
      const o = sendOffer(c, price, r.label || shortText(r.ask), r.id, "");
      if (!r.owner) botClientAccept(c, o, r);
      toast(`Price sent to ${r.client}.`); break;
    }
    case "day": S.schedDay = Number(v); render(); break;
    case "saveMe": {
      const me = S.me; me.bio = S.meEdit.bio.trim() || me.bio; me.area = S.meEdit.area; me.travel = Number(S.meEdit.travel);
      S.meEdit = null; toast("Saved. Your jobs list is updated."); scoreJobs(); break;
    }
    case "itemToggle": PRODUCTS[n].available = !PRODUCTS[n].available; render(); break;
    case "itMinus": PRODUCTS[n].price = Math.max(50, PRODUCTS[n].price - 50); render(); break;
    case "itPlus": PRODUCTS[n].price += 50; render(); break;
    case "npOpen": S.npOpen = true; S.npErr = ""; render(); break;
    case "npClose": S.npOpen = false; render(); break;
    case "npSave": {
      const np = S.np, price = parseInt(digits(np.price), 10), days = parseInt(digits(np.days), 10);
      if (np.name.trim().length < 3) { S.npErr = "Give the item a name."; render(); break; }
      if (!price) { S.npErr = "Add a price."; render(); break; }
      PRODUCTS.push({ id: PRODUCTS.length, name: np.name.trim(), maker: S.me.name, price, cat: np.cat, days: days || 3, desc: np.desc.trim() || "Handmade to order.", colour: "#E9DDFB", available: true });
      S.np = { name: "", price: "", cat: "Home", days: "5", desc: "" }; S.npOpen = false; toast("Added to the shop."); break;
    }
    case "setupTask": S.setup.step = 2; S.setup.task = Number(t.dataset.i); render(); break;
    case "setupDone": {
      const task = [...TASKS, ...WOMEN_TASKS.slice(0, 5)][S.setup.task];
      S.me = { id: people.length, name: S.user.name, trade: task[0], area: S.setup.area, mode: "in-person", travel: 15, rating: 0, jobs: 0, rate: "ask for a price",
        group: "user", reviews: [], available: true, woman: false, account: S.user.email, bio: S.setup.bio.trim() || `${task[0]}. ${task[2]}.`, phone: S.user.phone };
      people.push(S.me); tab("jobs"); scoreJobs(); break;
    }
  }
});

/* ---------- forms and inputs ---------- */
document.addEventListener("submit", e => {
  const f = e.target; e.preventDefault();
  if (f.id === "loginForm") {
    const ph = digits(S.login.phone), acc = ACCOUNTS.find(x => x.phone && digits(x.phone) === ph);
    if (!acc || S.login.pin.trim() !== acc.pin) { S.authErr = "That phone number or PIN isn't right. Try again, or tap a demo account below."; render(); return; }
    login(acc); return;
  }
  if (f.id === "signupForm") {
    const su = S.su;
    if (su.name.trim().length < 2) { S.authErr = "Please write your name."; render(); return; }
    if (digits(su.phone).length < 10) { S.authErr = "Please write your full phone number."; render(); return; }
    if (!/^\d{4}$/.test(su.pin.trim())) { S.authErr = "Your PIN must be 4 numbers."; render(); return; }
    if (ACCOUNTS.some(x => x.phone && digits(x.phone) === digits(su.phone))) { S.authErr = "This phone number already has an account. Sign in instead."; render(); return; }
    const acc = { email: "u" + digits(su.phone) + "@wasila.demo", role: su.role, name: su.name.trim(), area: su.area, phone: su.phone.trim(), pin: su.pin.trim() };
    ACCOUNTS.push(acc); S.su = { role: "client", name: "", phone: "", pin: "", area: "Maadi" }; login(acc); return;
  }
  if (f.id === "searchForm") { const q = S.q.trim(); if (q.length < 3) { toast("Write what you need first."); return; } S.q = ""; startSearch("", "pencil", q, false); return; }
  if (f.id === "shopSearch") { render(); return; }
  if (f.id === "chatForm") { const t = S.draftMsg.trim(); if (t) sendChat(t); }
});
document.addEventListener("input", e => {
  const el = e.target, p = el.dataset.bind;
  if (p) setPath(p, el.type === "range" ? Number(el.value) : el.value);
  if (el.id === "meTravel") { const o = document.getElementById("meTravelOut"); if (o) o.textContent = el.value + " km"; }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.bind && el.tagName === "SELECT") setPath(el.dataset.bind, el.value);
  if (el.id === "area") { S.area = el.value; render(); }
  if (el.id === "chatPhoto" && el.files?.[0]) {
    const r = new FileReader(); r.onload = () => sendChat("", r.result); r.readAsDataURL(el.files[0]);
  }
});

render();
setTimeout(() => { if (!window.__aiStarted) window.__aiFailed(); }, 20000);
</script>

window.__aiStarted = true;
let embedded = true;
try { embedded = window.self !== window.top; } catch (e) { embedded = true; }
if (embedded) {
  window.__aiFailed();
} else {
  try {
    const { pipeline, env } = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2");
    env.allowLocalModels = false;
    env.useBrowserCache = typeof caches !== "undefined" && window.isSecureContext;
    window.__aiLoaded(pipeline);
  } catch (e) {

}
